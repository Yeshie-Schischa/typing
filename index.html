<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>
<body>
    <div id="progress"><div id="progress-mover"></div></div>
    <main>
        
        <h1>Welcome to the typing website</h1>
        <h1>Type the following text:</h1>
        <div id="text"></div>
        
        <p>Correct: <span id="correct-count">0</span></p>
        <p>Incorrect: <span id="incorrect-count">0</span></p>
        <p>Timer: <span id="timer">0:00</span></p>
        <button id="start-button">Start</button>
        <!-- <button id="reset-button">Reset</button> -->
    </main>
    <script src="script.js"></script>
</body>
</html>
